name: Official interoperability

on:
  workflow_call:
    inputs:
      lane:
        type: string
        required: false
        default: all
      candidate_artifact:
        description: Current protected-main product CD manifest artifact, before promotion
        type: string
        required: false
        default: ''
      candidate_manifest_sha256:
        type: string
        required: false
        default: ''
      candidate_tag:
        type: string
        required: false
        default: ''
      harness_revision:
        description: Exact integration source used by the product caller
        type: string
        required: false
        default: ''
      collect_only:
        description: Collect raw candidate verdicts for the caller's independent release gate; never qualification
        type: boolean
        required: false
        default: false
      review_recipient:
        description: Public native age recipient for private screenshot/export delivery; never an identity key
        type: string
        required: false
        default: ''
  schedule:
    - cron: "41 5 8 * *"
  workflow_dispatch:
    inputs:
      review_recipient:
        description: Optional public age recipient; defaults to the repository review recipient variable
        type: string
        required: false
        default: ''
      lane:
        description: Official suite lane to run
        type: choice
        required: true
        default: all
        options:
          - all
          - oid4vci-issuer
          - oid4vp-final
          - oid4vp-url-query
          - oid4vp-mdoc
          - haip
          - w3c-v2
          - eudi

permissions:
  contents: read
  packages: read
  attestations: read

concurrency:
  group: official-interoperability-${{ github.ref }}-${{ inputs.lane || 'all' }}
  cancel-in-progress: false

jobs:
  run-lane:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON((github.event_name == 'schedule' || inputs.lane == 'all') && '["oid4vci-issuer","oid4vp-final","oid4vp-url-query","oid4vp-mdoc","haip","w3c-v2","eudi"]' || format('["{0}"]', inputs.lane)) }}
    env:
      PYTHONUNBUFFERED: "1"
      OFFICIAL_SUITE_RUN_ID: ${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
      REVIEW_RECIPIENT: ${{ inputs.review_recipient || vars.OFFICIAL_REVIEW_RECIPIENT || '' }}
    steps:
      - name: Validate candidate caller before fetching source
        env:
          CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact }}
          CANDIDATE_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          HARNESS_REVISION: ${{ inputs.harness_revision }}
          LANE: ${{ inputs.lane || 'all' }}
          COLLECT_ONLY: ${{ inputs.collect_only || false }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$CANDIDATE_ARTIFACT" ]; then
            test "$GITHUB_REPOSITORY" = ElevenID/marty-ui
            test "$GITHUB_REF" = refs/heads/main
            test "$LANE" = all
            test "$CANDIDATE_ARTIFACT" = "stack-release-official-candidate-$GITHUB_RUN_ID"
            [[ "$HARNESS_REVISION" =~ ^[0-9a-f]{40}$ ]]
            [[ "$CANDIDATE_MANIFEST_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$CANDIDATE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            if [[ "$COLLECT_ONLY" == true ]]; then
              [[ "$REVIEW_RECIPIENT" =~ ^age1[0-9a-z]{58}$ ]]
            fi
          else
            test "$GITHUB_REPOSITORY" = ElevenID/marty-integration-tests
            test -z "$CANDIDATE_MANIFEST_SHA256$CANDIDATE_TAG$HARNESS_REVISION"
            test "$COLLECT_ONLY" != true
          fi

      - name: Checkout integration harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ElevenID/marty-integration-tests
          ref: ${{ inputs.harness_revision || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          # This job executes release-pinned source after setup. A writable
          # post-job cache would let that source influence privileged caches.

      - name: Install hash-locked harness dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          --requirement requirements/official-py312.lock

      - name: Verify runner-provided released-stack browser
        if: matrix.lane == 'oid4vp-final'
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome)"
          test -x "$browser"
          "$browser" --version
          echo "MARTY_PLAYWRIGHT_BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"

      - name: Resolve and attest released stack
        if: inputs.candidate_artifact == ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          stack_args=(
            --pin conformance/stack-under-test.json
            --output-dir work/stack
            --metadata-output work/stack/stack-metadata.json
          )
          python scripts/official_stack_release.py materialize "${stack_args[@]}"

      - name: Download current pre-publication candidate
        if: inputs.candidate_artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.candidate_artifact }}
          path: work/candidate

      - name: Verify exact protected-main candidate without a published release
        if: inputs.candidate_artifact != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
        shell: bash
        run: >-
          python scripts/official_stack_release.py materialize-candidate
          --manifest work/candidate/stack-manifest.json
          --tag "$CANDIDATE_TAG" --source-sha "$GITHUB_SHA"
          --manifest-sha256 "$CANDIDATE_MANIFEST_SHA256"
          --output-dir work/stack --metadata-output work/stack/stack-metadata.json

      - name: Verify and pull attested stack images
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          while IFS=$'\t' read -r repository reference; do
            gh attestation verify "oci://$reference" --repo "$repository"
            docker pull "$reference"
          done < <(jq -r '.images[] | [.repository, .reference] | @tsv' work/stack/stack-metadata.json)
          python scripts/render_stack_env.py --manifest work/stack/stack-manifest.json --output work/stack/.env.stack --allow-historical-three-image

      - name: Checkout released Marty deployment adapter
        if: inputs.candidate_artifact == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ElevenID/marty-ui
          ref: a10bf3189383ce91002a795a7bc4f03c1d5c3d1a
          path: work/marty-ui
          persist-credentials: false

      - name: Checkout exact product candidate deployment adapter
        if: inputs.candidate_artifact != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ElevenID/marty-ui
          ref: ${{ github.sha }}
          path: work/marty-ui
          persist-credentials: false

      - name: Checkout exact OIDF runner
        if: matrix.lane == 'oid4vci-issuer' || matrix.lane == 'oid4vp-final' || matrix.lane == 'oid4vp-url-query' || matrix.lane == 'oid4vp-mdoc' || matrix.lane == 'haip'
        run: python scripts/official_suite_checkout.py --suite oidf --output work/oidf-runner

      - name: Checkout exact W3C suite
        if: matrix.lane == 'w3c-v2'
        run: python scripts/official_suite_checkout.py --suite w3c --output work/w3c-suite

      - name: Set up Node 24 for W3C suite
        if: matrix.lane == 'w3c-v2'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"

      - name: Bootstrap integrity-verified npm runtime
        if: matrix.lane == 'w3c-v2'
        shell: bash
        run: |
          npm_cli="$(python scripts/w3c_vc_conformance.py bootstrap-npm --output work/npm-runtime)"
          echo "W3C_NPM_CLI=$npm_cli" >> "$GITHUB_ENV"

      - name: Generate disposable TLS and EUDI material
        run: |
          python scripts/eudi_test_material.py generate --output work/material --marty-port 18443 --staging-ca-key work/material/official-ca.key
          python scripts/eudi_test_material.py validate --material work/material
          python -c "import json; from urllib.parse import urlsplit; data=json.load(open('work/material/report.json', encoding='utf-8')); hosts=sorted({urlsplit(value).hostname for value in data['urls'].values()} | {'localhost.emobix.co.uk'}); print('127.0.0.1 ' + ' '.join(host for host in hosts if host and host != 'localhost'))" | sudo tee -a /etc/hosts

      - name: Prepare disposable verifier trust material
        if: matrix.lane == 'oid4vp-final' || matrix.lane == 'oid4vp-url-query' || matrix.lane == 'oid4vp-mdoc' || matrix.lane == 'haip' || matrix.lane == 'eudi'
        run: |
          python -c "import json, subprocess, sys; data=json.load(open('work/material/environment.json', encoding='utf-8')); subprocess.run([sys.executable, 'scripts/haip_test_certificates.py', '--output-dir', 'work/haip-material', '--gateway-url', data['environment']['OIDF_PUBLIC_BASE_URL']], check=True)"

      - name: Generate disposable operator credentials
        shell: bash
        run: |
          # Keycloak's production password policy requires a special
          # character. Keep entropy random while making disposable runner
          # credentials policy-compliant on every supported Keycloak image.
          admin_password="$(openssl rand -hex 32)!A1"
          reviewer_password="$(openssl rand -hex 32)!B2"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$reviewer_password"
          echo "MARTY_CONFORMANCE_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          echo "MARTY_CONFORMANCE_REVIEWER_PASSWORD=$reviewer_password" >> "$GITHUB_ENV"

      - name: Bootstrap disposable KMS-only released stack
        shell: bash
        run: >-
          python scripts/official_kms_bootstrap.py
          --run-id "$OFFICIAL_SUITE_RUN_ID"
          --marty-ui work/marty-ui
          --stack-manifest work/stack/stack-manifest.json
          --stack-env work/stack/.env.stack
          --material work/material
          --output-dir work/kms

      - name: Run official lane
        id: lane
        env:
          # The released native launcher independently re-verifies the manifest.
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          lane_args=(
            --lane "${{ matrix.lane }}"
            --run-id "$OFFICIAL_SUITE_RUN_ID"
            --marty-ui work/marty-ui
            --stack-manifest work/stack/stack-manifest.json
            --stack-metadata work/stack/stack-metadata.json
            --stack-env work/stack/.env.stack
            --kms-env work/kms/.env.kms
            --material work/material
            --haip-material work/haip-material
            --oidf-runner work/oidf-runner
            --w3c-suite work/w3c-suite
            --output-dir work/evidence
          )
          python scripts/official_interoperability_lane.py "${lane_args[@]}"
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record locally built EUDI harness digest
        if: always() && matrix.lane == 'eudi'
        run: >-
          python scripts/eudi_harness_provenance.py
          --project "eudi-reference-${OFFICIAL_SUITE_RUN_ID}"
          --output work/eudi-harness-image.json

      - name: Build public-safe evidence
        id: summary
        if: always()
        env:
          LANE_EXIT_CODE: ${{ steps.lane.outputs.exit_code || '99' }}
        shell: bash
        run: |
          sanitize_args=(
            --input work/evidence/raw
            --output "work/sanitized/${{ matrix.lane }}"
            --lane "${{ matrix.lane }}"
            --harness-commit "$(git rev-parse HEAD)"
            --exit-code "$LANE_EXIT_CODE"
            --stack-metadata work/stack/stack-metadata.json
            --material-report work/material/report.json
            --harness-image-report work/eudi-harness-image.json
            --github-output "$GITHUB_OUTPUT"
          )
          python scripts/sanitize_official_evidence.py "${sanitize_args[@]}"

      - name: Upload sanitized evidence
        id: upload
        if: always() && hashFiles(format('work/sanitized/{0}/summary.json', matrix.lane)) != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: official-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/sanitized/${{ matrix.lane }}/summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Install the digest-pinned private review encryptor
        if: always() && steps.summary.outcome == 'success' && steps.summary.outputs.has_reviews == 'true' && env.REVIEW_RECIPIENT != ''
        run: python scripts/official_review_crypto.py --output work/review-crypto

      - name: Encrypt exact private review images and unchanged exports
        if: always() && steps.summary.outcome == 'success' && steps.summary.outputs.has_reviews == 'true' && env.REVIEW_RECIPIENT != ''
        shell: bash
        run: >-
          python scripts/official_review_delivery.py encrypt
          --summary "work/sanitized/${{ matrix.lane }}/summary.json"
          --raw work/evidence/raw
          --private-images work/evidence/private/verification-evidence
          --private-exports work/evidence/private/official-review-evidence-export
          --recipient "$REVIEW_RECIPIENT" --execution-id "$OFFICIAL_SUITE_RUN_ID"
          --attempt "$GITHUB_RUN_ATTEMPT" --age work/review-crypto/age
          --output "work/review-delivery/${{ matrix.lane }}"

      - name: Upload only encrypted private review delivery
        if: always() && hashFiles(format('work/review-delivery/{0}/review-delivery.json', matrix.lane)) != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: official-review-private-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/review-delivery/${{ matrix.lane }}/review.tar.age
            work/review-delivery/${{ matrix.lane }}/review-delivery.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce lane result
        if: always()
        env:
          LANE_EXIT_CODE: ${{ steps.lane.outputs.exit_code }}
          COLLECT_ONLY: ${{ inputs.collect_only || false }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        shell: bash
        run: |
          if [[ -z "$LANE_EXIT_CODE" ]]; then
            echo "Official lane did not reach its dispatcher." >&2
            exit 1
          fi
          if [[ "$COLLECT_ONLY" == true ]]; then
            # Only the protected-main candidate caller can opt in. A successful
            # collection is not a passing suite: preserve every raw exit/result
            # and require the independent Rust gate before any promotion. This
            # lets a review-only gate retry reuse the immutable seven-lane set.
            test "$SUMMARY_OUTCOME" = success || exit 1
            test "$UPLOAD_OUTCOME" = success || exit 1
            echo "::notice::Official raw exit is $LANE_EXIT_CODE; candidate qualification remains the independent caller gate's responsibility."
            exit 0
          fi
          exit "$LANE_EXIT_CODE"

      - name: Erase disposable bootstrap authorities
        if: always()
        shell: bash
        run: rm -f work/material/official-ca.key work/kms/bootstrap-root-token
