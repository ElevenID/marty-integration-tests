name: Credentials verifier artifact

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/credentials-verifier-artifact.yml
      - config/base-images.json
      - config/credentials-verifier-oracle.json
      - config/credentials-verifier-under-test.json
      - config/credentials-verifier-released-transaction.json
      - requirements/official-py312.lock
      - scripts/credentials_verifier_artifact.py
      - tests/unit/test_credentials_verifier_artifact.py
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/credentials-verifier-artifact.yml
      - config/base-images.json
      - config/credentials-verifier-oracle.json
      - config/credentials-verifier-under-test.json
      - config/credentials-verifier-released-transaction.json
      - requirements/official-py312.lock
      - scripts/credentials_verifier_artifact.py
      - tests/unit/test_credentials_verifier_artifact.py
  schedule:
    - cron: "41 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  attestations: read

concurrency:
  group: credentials-verifier-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  released-verifier:
    name: Released verifier (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: python-oracle-v0.1.71
            pin: config/credentials-verifier-oracle.json
            state: ready
            mode: pass
          - id: rejected-rust-v1.1.208
            pin: config/credentials-verifier-under-test.json
            state: ineligible
            mode: expected-failure
          - id: published-rust-transaction
            pin: config/credentials-verifier-released-transaction.json
            state: transaction
            mode: transaction
    env:
      PIN_FILE: ${{ matrix.pin }}
      PIN_STATE: ${{ matrix.state }}
    steps:
      - name: Checkout test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/official-py312.lock

      - name: Install hash-locked harness dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          --requirement requirements/official-py312.lock

      - name: Validate immutable pin and harness
        run: |
          python scripts/credentials_verifier_artifact.py validate-pin --pin "$PIN_FILE" --state "$PIN_STATE"
          python -m pytest tests/unit/test_credentials_verifier_artifact.py -q

      - name: Resolve exact artifact metadata
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          repository="$(jq -er '.repository' "$PIN_FILE")"
          if [ "$PIN_STATE" = transaction ]; then
            release_tag="v$(jq -er '.version' "$PIN_FILE")"
          else
            release_tag="$(jq -er '.release_tag' "$PIN_FILE")"
          fi
          commit="$(jq -er '.commit' "$PIN_FILE")"
          source_ref="$(jq -er '.source_ref' "$PIN_FILE")"
          image_uri="$(jq -er '.image.uri' "$PIN_FILE")"
          image_digest="$(jq -er '.image.digest' "$PIN_FILE")"
          sbom_asset="$(jq -er '.sbom.asset' "$PIN_FILE")"
          sbom_digest="$(jq -er '.sbom.digest' "$PIN_FILE")"
          tag_object="$(gh api "repos/$repository/git/ref/tags/$release_tag" --jq '.object.sha')"
          mkdir -p work/credentials-verifier
          gh api "repos/$repository/git/tags/$tag_object" > work/credentials-verifier/tag-metadata.json
          tagged_commit="$(jq -er '.object.sha' work/credentials-verifier/tag-metadata.json)"
          test "$tagged_commit" = "$commit"
          if [ "$PIN_STATE" = transaction ]; then
            gh api "repos/$repository/releases/tags/$release_tag" > work/credentials-verifier/release-metadata.json
            python scripts/credentials_verifier_artifact.py validate-published-transaction \
              --pin "$PIN_FILE" \
              --tag-metadata work/credentials-verifier/tag-metadata.json \
              --release-metadata work/credentials-verifier/release-metadata.json
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "image_reference=$image_uri@$image_digest" >> "$GITHUB_OUTPUT"
          echo "sbom_asset=$sbom_asset" >> "$GITHUB_OUTPUT"
          echo "sbom_digest=$sbom_digest" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Authenticate to the public package registry
        shell: bash
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify provenance and pull immutable artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/credentials-verifier
          gh attestation verify "oci://${{ steps.artifact.outputs.image_reference }}" \
            --repo "${{ steps.artifact.outputs.repository }}" \
            --source-digest "${{ steps.artifact.outputs.commit }}" \
            --source-ref "${{ steps.artifact.outputs.source_ref }}" \
            --deny-self-hosted-runners
          docker pull "${{ steps.artifact.outputs.image_reference }}"
          gh release download "${{ steps.artifact.outputs.release_tag }}" \
            --repo "${{ steps.artifact.outputs.repository }}" \
            --pattern "${{ steps.artifact.outputs.sbom_asset }}" \
            --dir work/credentials-verifier
          printf '%s  %s\n' \
            "${{ steps.artifact.outputs.sbom_digest }}" \
            "work/credentials-verifier/${{ steps.artifact.outputs.sbom_asset }}" \
            | sed 's/^sha256://' \
            | sha256sum --check --strict
          gh attestation verify "work/credentials-verifier/${{ steps.artifact.outputs.sbom_asset }}" \
            --repo "${{ steps.artifact.outputs.repository }}" \
            --source-digest "${{ steps.artifact.outputs.commit }}" \
            --source-ref "${{ steps.artifact.outputs.source_ref }}" \
            --deny-self-hosted-runners
          python scripts/credentials_verifier_artifact.py validate-sbom \
            --pin "$PIN_FILE" \
            --state "$PIN_STATE" \
            --sbom "work/credentials-verifier/${{ steps.artifact.outputs.sbom_asset }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run governed artifact-only verification matrix
        if: matrix.mode == 'pass'
        run: >-
          python scripts/credentials_verifier_artifact.py run
          --pin "$PIN_FILE"
          --provenance-verified
          --evidence work/evidence/credentials-verifier-summary.json

      - name: Prove the harness rejects the known-ineligible artifact
        if: matrix.mode == 'expected-failure'
        run: >-
          python scripts/credentials_verifier_artifact.py run-expected-failure
          --pin "$PIN_FILE"
          --provenance-verified
          --evidence work/evidence/credentials-verifier-summary.json

      - name: Run the published exact-digest transaction through every runtime gate
        if: matrix.mode == 'transaction'
        run: >-
          python scripts/credentials_verifier_artifact.py run-transaction
          --pin "$PIN_FILE"
          --provenance-verified
          --evidence work/evidence/credentials-verifier-summary.json

      - name: Upload sanitized artifact evidence
        if: always() && hashFiles('work/evidence/credentials-verifier-summary.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: credentials-verifier-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/evidence/credentials-verifier-summary.json
          if-no-files-found: error
          retention-days: 14

  compare-language-neutral-evidence:
    name: Compare candidate and oracle evidence
    needs: released-verifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/official-py312.lock

      - name: Install hash-locked harness dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          --requirement requirements/official-py312.lock

      - name: Download all three runtime observations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: credentials-verifier-*
          path: work/comparison-input
          merge-multiple: false

      - name: Compare language-neutral evidence and check sets
        shell: bash
        run: |
          set -euo pipefail
          oracle="$(find work/comparison-input -path '*python-oracle-v0.1.71*/*summary.json' -print -quit)"
          candidate="$(find work/comparison-input -path '*rejected-rust-v1.1.208*/*summary.json' -print -quit)"
          test -n "$oracle"
          test -n "$candidate"
          python scripts/credentials_verifier_artifact.py compare-evidence \
            --oracle "$oracle" \
            --candidate "$candidate" \
            --evidence work/evidence/credentials-verifier-comparison.json
          transaction="$(find work/comparison-input -path '*published-rust-transaction*/*summary.json' -print -quit)"
          test -n "$transaction"
          python scripts/credentials_verifier_artifact.py compare-transaction-evidence \
            --oracle "$oracle" \
            --transaction "$transaction" \
            --oracle-pin config/credentials-verifier-oracle.json \
            --transaction-pin config/credentials-verifier-released-transaction.json \
            --evidence work/evidence/credentials-verifier-published-comparison.json

      - name: Upload comparison evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: credentials-verifier-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/evidence/credentials-verifier-comparison.json
            work/evidence/credentials-verifier-published-comparison.json
          if-no-files-found: error
          retention-days: 14

  candidate-containerd-load:
    name: Candidate containerd load contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RUN_CANDIDATE_DOCKER_TESTS: "true"
    steps:
      - name: Checkout test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/official-py312.lock

      - name: Configure the pinned candidate runtime
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: v29.7.2
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Install hash-locked harness dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          --requirement requirements/official-py312.lock

      - name: Prove candidate archives load through the reviewed runtime
        run: >-
          python -m pytest -q
          tests/unit/test_credentials_verifier_artifact.py::test_candidate_archive_real_containerd_rejects_preexisting_wrong_literal_tag
          tests/unit/test_credentials_verifier_artifact.py::test_candidate_archive_disposable_containerd_load_contract
