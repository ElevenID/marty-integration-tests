name: Release OSS integration suite

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Bind release tag to protected main before official qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_release_lineage.py --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --expected-commit "$GITHUB_SHA"
      - name: Refuse an existing draft or published release before official qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_release_absent.py --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --actions-write-token

  official-interoperability:
    name: Require the complete pinned official suite
    needs: verify-source
    permissions:
      actions: read
      contents: read
      packages: read
      attestations: read
    uses: ./.github/workflows/official-interoperability.yml
    with:
      lane: all
      collect_only: true

  released-official-gate:
    name: Qualify original released-stack official evidence
    needs: [verify-source, official-interoperability]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      attestations: read
    env:
      # Replace with the protected-main merge commit of product PR #1919.
      PRODUCT_GATE_SHA: 4f2f971dad48af80684436d56c47055a20fc7d6a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
      - name: Require original protected release run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ElevenID/marty-integration-tests
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/check_release_lineage.py --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --expected-commit "$GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ElevenID/marty-ui
          ref: ${{ env.PRODUCT_GATE_SHA }}
          path: product-gate
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate the exact product gate source on protected main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product-gate rev-parse HEAD)" = "$PRODUCT_GATE_SHA"
          test "$(gh api repos/ElevenID/marty-ui/branches/main --jq .protected)" = true
          main_sha="$(gh api repos/ElevenID/marty-ui/branches/main --jq .commit.sha)"
          git -C product-gate fetch --no-tags origin "$main_sha"
          git -C product-gate merge-base --is-ancestor "$PRODUCT_GATE_SHA" "$main_sha"
      - name: Verify the reviewed signed stack release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          python scripts/official_stack_release.py materialize
          --pin conformance/stack-under-test.json
          --output-dir work/released-stack
          --metadata-output work/released-stack/stack-metadata.json
      - name: Build the locked public-dependency product gate
        shell: bash
        run: >-
          cargo build --locked --release
          --manifest-path product-gate/tools/official-suite-validator/Cargo.toml
          --target-dir work/official-gate-tools
      - name: Download all seven original same-run summaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for lane in oid4vci-issuer oid4vp-final oid4vp-url-query oid4vp-mdoc haip w3c-v2 eudi; do
            artifact="official-${lane}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "$artifact" --dir "work/official-summaries/$artifact"
          done
      - name: Qualify unchanged official results and automated verifier evidence
        shell: bash
        run: |
          set -euo pipefail
          gate=work/official-gate-tools/release/marty-official-suite-validator
          source="$(jq -er .marty_commit conformance/stack-under-test.json)"
          mkdir -p work/released-gate
          "$gate" --prepare-released work/released-stack/stack-manifest.json \
            "$source" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            work/official-summaries > work/released-gate/official-release-plan.json
          "$gate" --automated-released work/released-stack/stack-manifest.json \
            "$source" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            work/official-summaries > work/released-gate/official-release-gate.json
          plan_sha="$(sha256sum work/released-gate/official-release-plan.json | cut -d' ' -f1)"
          jq -e --arg source "$source" --arg harness "$GITHUB_SHA" \
            --argjson run "$GITHUB_RUN_ID" --arg plan "sha256:$plan_sha" \
            '.schema == "marty.official-released-gate/v1" and
             .qualification_context == "PUBLISHED_RELEASE" and
             .source_sha == $source and .harness_sha == $harness and .run_id == $run and
             .automated_qualification.evidence_run_attempt == 1 and
             .automated_qualification.request_sha256 == $plan and
             (.lanes | length) == 7' work/released-gate/official-release-gate.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: official-released-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/released-gate/
          if-no-files-found: error
          retention-days: 90

  release:
    needs: [verify-source, official-interoperability, released-official-gate]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Bind release tag to protected main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_release_lineage.py --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --expected-commit "$GITHUB_SHA"
      - name: Install uv without a tag-scoped dependency cache
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.11.3"
          enable-cache: false
      - name: Reject any existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_release_absent.py --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --actions-write-token
      - name: Validate version and test the public suite
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          actual="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "$version" = "$actual"
          uv pip install --system build ".[dev]"
          pytest tests/unit -v
          python -m build
      - name: Collect versioned release artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir release-assets
          cp dist/* release-assets/
          git archive --format=tar.gz \
            --prefix="marty-integration-tests-${version}/" \
            --output="release-assets/marty-integration-tests-${version}-source.tar.gz" \
            HEAD
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: official-released-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          format: spdx-json
          output-file: release-assets/marty-integration-tests.spdx.json
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532
      - name: Sign and checksum release artifacts
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f ! -name '*.sigstore.json' -print0 | while IFS= read -r -d '' file; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
          done
          (
            cd release-assets
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS
            mv ../SHA256SUMS SHA256SUMS
            cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          )
      - name: Recheck complete release absence before attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_release_absent.py --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --actions-write-token
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: release-assets/**
      - name: Revalidate release tag lineage before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_release_lineage.py --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --expected-commit "$GITHUB_SHA"
      - name: Publish complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_release_absent.py --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --actions-write-token
          gh release create "$GITHUB_REF_NAME" --verify-tag --target "$GITHUB_SHA" --generate-notes --latest release-assets/*
