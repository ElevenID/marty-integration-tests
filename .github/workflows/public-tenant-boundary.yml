name: Public tenant boundary

on:
  schedule:
    - cron: "17 6 15 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  attestations: read

concurrency:
  group: public-tenant-boundary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  two-organization-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      PUBLIC_BOUNDARY_RUN_ID: tenant-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout ElevenID test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          # This job executes release-pinned source after setup. A writable
          # post-job cache would let that source influence privileged caches.

      - name: Install hash-locked test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          --requirement requirements/official-py312.lock

      - name: Set up Go for independent DIDComm verification
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.0"
          cache: false

      - name: Checkout pinned independent DIDComm implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: notabene-id/go-didcomm
          ref: 5ffd085c2b5088a639c1c0d3910d668887298ce5
          path: work/go-didcomm
          persist-credentials: false

      - name: Build independent DIDComm verifier
        shell: bash
        run: |
          set -euo pipefail
          export GOSUMDB=sum.golang.org
          export GONOSUMDB=
          verifier="$RUNNER_TEMP/go-didcomm-verifier"
          (
            cd work/go-didcomm
            test "$(git rev-parse HEAD)" = "5ffd085c2b5088a639c1c0d3910d668887298ce5"
            test -z "$(git status --short)"
            go build -mod=readonly -trimpath -o "$verifier" ./cmd/didcomm
          )
          go version -m "$verifier" | grep -F 'github.com/Notabene-id/go-didcomm'
          echo "DIDCOMM_INTEROP_CLI=$verifier" >> "$GITHUB_ENV"
          echo "DIDCOMM_INTEROP_IMPLEMENTATION=notabene-id/go-didcomm@v0.4.0#5ffd085c2b5088a639c1c0d3910d668887298ce5" >> "$GITHUB_ENV"
          echo "DIDCOMM_INDEPENDENT_VERIFIER_REQUIRED=true" >> "$GITHUB_ENV"

      - name: Install released-stack browser
        run: python -m playwright install --with-deps chromium

      - name: Resolve and attest released stack
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          stack_args=(
            --pin conformance/stack-under-test.json
            --output-dir work/stack
            --metadata-output work/stack/stack-metadata.json
          )
          python scripts/official_stack_release.py materialize "${stack_args[@]}"

      - name: Verify and pull attested stack images
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          while IFS=$'\t' read -r repository reference; do
            gh attestation verify "oci://$reference" --repo "$repository"
            docker pull "$reference"
          done < <(jq -r '.images[] | [.repository, .reference] | @tsv' work/stack/stack-metadata.json)
          python scripts/render_stack_env.py --manifest work/stack/stack-manifest.json --output work/stack/.env.stack

      - name: Install attested released DIDComm verifier
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          component="$(jq -cer '
            [.components[] | select(.name == "marty-core-python")]
            | if length == 1 then .[0] else error("expected exactly one marty-core-python component") end
          ' work/stack/stack-manifest.json)"
          repository="$(jq -er '.repository' <<<"$component")"
          artifact="$(jq -cer '
            [.artifacts[] | select(.type == "python")]
            | if length == 1 then .[0] else error("expected exactly one marty-core-python wheel") end
          ' <<<"$component")"
          uri="$(jq -er '.uri' <<<"$artifact")"
          digest="$(jq -er '.digest' <<<"$artifact")"
          test "$repository" = "ElevenID/marty-core"
          case "$uri" in
            https://github.com/ElevenID/marty-core/releases/download/*.whl) ;;
            *) echo "The DIDComm verifier is not an immutable marty-core release wheel" >&2; exit 1 ;;
          esac
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          wheel="$RUNNER_TEMP/$(basename "$uri")"
          curl --fail --location --retry 3 --silent --show-error "$uri" --output "$wheel"
          printf '%s  %s\n' "${digest#sha256:}" "$wheel" | sha256sum --check --strict
          gh attestation verify "$wheel" --repo "$repository"
          python -m pip install --disable-pip-version-check --no-deps --no-index "$wheel"
          python -c "from marty_rs import _marty_rs; assert callable(_marty_rs.didcomm_decrypt)"

      - name: Checkout released deployment adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ElevenID/marty-ui
          ref: d819a40888165532db8e5e2bcf593cbfff2b96b0
          path: work/marty-ui
          persist-credentials: false

      - name: Generate disposable TLS material
        run: |
          python scripts/eudi_test_material.py generate --output work/material --marty-port 18443
          python scripts/eudi_test_material.py validate --material work/material
          python -c "import json; from urllib.parse import urlsplit; data=json.load(open('work/material/report.json', encoding='utf-8')); hosts=sorted({urlsplit(value).hostname for value in data['urls'].values()}); print('127.0.0.1 ' + ' '.join(host for host in hosts if host and host != 'localhost'))" | sudo tee -a /etc/hosts

      - name: Generate disposable principal credentials
        shell: bash
        run: |
          admin_password="$(openssl rand -hex 32)!A1"
          reviewer_password="$(openssl rand -hex 32)!B2"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$reviewer_password"
          echo "MARTY_CONFORMANCE_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          echo "MARTY_CONFORMANCE_REVIEWER_PASSWORD=$reviewer_password" >> "$GITHUB_ENV"

      - name: Run ElevenID-owned public-boundary matrix
        id: boundary
        shell: bash
        run: |
          set +e
          python scripts/public_boundary_lane.py \
            --run-id "$PUBLIC_BOUNDARY_RUN_ID" \
            --marty-ui work/marty-ui \
            --stack-manifest work/stack/stack-manifest.json \
            --stack-metadata work/stack/stack-metadata.json \
            --stack-env work/stack/.env.stack \
            --material work/material \
            --output-dir work/evidence
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload public product-security evidence
        if: always() && hashFiles('work/evidence/summary.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tenant-boundary-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/evidence/summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce boundary result
        if: always()
        env:
          BOUNDARY_EXIT_CODE: ${{ steps.boundary.outputs.exit_code }}
        shell: bash
        run: |
          if [[ -z "$BOUNDARY_EXIT_CODE" ]]; then
            echo "Public-boundary lane did not reach its dispatcher." >&2
            exit 1
          fi
          exit "$BOUNDARY_EXIT_CODE"
