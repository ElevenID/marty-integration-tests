name: Official interoperability suite updates

on:
  schedule:
    - cron: "31 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-suite-updates
  cancel-in-progress: false

jobs:
  review-upstream-drift:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Detect upstream drift
        id: drift
        run: |
          if python scripts/official_suite_updates.py --write; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 3 ]; then exit "$status"; fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open review PR
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/official-suite-updates"
          title="chore: review official interoperability suite updates"
          body="Upstream drift was detected. Review the recorded revisions, update immutable pins and image digests intentionally, then run the affected official suites or independent interoperability lane before merging. This bot never changes pins or merges the PR."
          existing_pr="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            echo "::notice::Preserving open review PR #$existing_pr and its branch; refresh upstream observations manually."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" > /dev/null; then
            echo "::error::The review branch already exists without an open PR; reconcile it manually."
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
          git config user.name "elevenid-automation[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add conformance/upstream-review.json
          git commit -m "chore: review official suite upstream updates"
          # An empty expected value requires the remote branch to remain absent.
          # It cannot replace a branch created concurrently after the check above.
          git push --force-with-lease="refs/heads/$branch:" origin "HEAD:refs/heads/$branch"
          gh pr create --draft --base main --head "$branch" --title "$title" --body "$body"
