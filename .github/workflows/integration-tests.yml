name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Install uv with a bounded dependency cache
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: integration-tests

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      # Pull-request validation is hermetic and secretless. Full-stack tests
      # are run by the marty-ui release workflow from its attested manifest and
      # digest-pinned public artifacts.
      - name: Run hermetic unit tests
        run: pytest -n 2 --dist=worksteal tests/unit/ -v --tb=short

      - name: Validate changed integration contracts
        run: |
          pytest \
            tests/integration/test_oid4vci_issuer_conformance.py \
            tests/integration/gateway/test_deployment_profile_flow.py \
            tests/integration/gateway/test_two_organization_isolation.py \
            tests/oss_stack/test_application_approval_boundary.py \
            tests/oss_stack/test_application_offer_recovery.py \
            --collect-only -q
