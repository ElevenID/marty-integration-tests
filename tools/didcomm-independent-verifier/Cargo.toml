[package]
name = "didcomm-independent-verifier"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0"
didcomm = { git = "https://github.com/sicpa-dlab/didcomm-rust", rev = "9fd70993e9a6e5fd527058ecfe173ee066bcbc27" }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["macros", "rt"] }

[dev-dependencies]
didcomm = { git = "https://github.com/sicpa-dlab/didcomm-rust", rev = "9fd70993e9a6e5fd527058ecfe173ee066bcbc27", features = ["testvectors"] }
