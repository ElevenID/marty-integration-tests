services:
  trust-registry-fixture:
    # Controller-only Python 3.12.10 runtime; the released native services
    # image intentionally contains no Python. This is not a product artifact.
    image: python@sha256:fd95fa221297a88e1cf49c55ec1828edd7c5a428187e67b5d1805692d11588db
    pull_policy: if_not_present
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 32
    cpus: 0.25
    entrypoint: ["python"]
    command: ["/fixture/trust_registry_fixture.py"]
    # Generated private material remains mode 0600. Run as the owning host
    # identity so Linux bind mounts stay readable without DAC_OVERRIDE. The
    # process receives only the capability needed to bind HTTPS/443.
    user: "${TRUST_REGISTRY_FIXTURE_UID:?set the fixture file-owner UID}:${TRUST_REGISTRY_FIXTURE_GID:?set the fixture file-owner GID}"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      TRUST_REGISTRY_FIXTURE_TOKEN: ${TRUST_REGISTRY_FIXTURE_TOKEN:?generate a disposable control token}
      DIDCOMM_FIXTURE_DESCRIPTOR: /fixture/didcomm-sender-bootstrap.json
      DIDCOMM_FIXTURE_CA: /fixture/openbao-ca.pem
      DIDCOMM_FIXTURE_RUN_ID: ${DIDCOMM_FIXTURE_RUN_ID:?set the exact owned run}
    volumes:
      - ${TRUST_REGISTRY_FIXTURE_SCRIPT:?set the absolute fixture script path}:/fixture/trust_registry_fixture.py:ro
      - ${DIDCOMM_FIXTURE_MODULE:?set the sender controller module}:/fixture/didcomm_sender_fixture.py:ro
      - ${DIDCOMM_FIXTURE_DESCRIPTOR_FILE:?set the private two-use capability}:/fixture/didcomm-sender-bootstrap.json:ro
      - ${DIDCOMM_FIXTURE_CA_FILE:?set the public OpenBao CA}:/fixture/openbao-ca.pem:ro
      - ${OIDF_TLS_CERT_DIR:?set OIDF_TLS_CERT_DIR to generated conformance material}:/material:ro
    ports:
      - "127.0.0.1::8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import socket;
          connection = socket.create_connection(('127.0.0.1', 8080), timeout=2);
          connection.close()
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
    networks:
      marty-network:
        aliases:
          - trust-registry-fixture
    restart: "no"

networks:
  marty-network:
    external: true
    name: ${MARTY_CONFORMANCE_PROJECT:?set the exact Marty conformance project}_marty-network
