# Artifact-only public stack. Generate .env.stack from stack-manifest.json with
# `python scripts/render_stack_env.py --manifest stack-manifest.json`.

x-service: &service
  image: ${MARTY_SERVICES_IMAGE:?run scripts/render_stack_env.py first}
  restart: "no"
  environment: &service-env
    # This stack is a disposable artifact-verification environment. Declare it
    # explicitly so native services never inherit production-only mTLS policy.
    ENVIRONMENT: test
    DATABASE_URL: postgresql+asyncpg://marty:marty_oss_ci_2026@postgres:5432/marty_credentials
    REDIS_URL: redis://redis:6379
    GRPC_SERVICE_TOKEN: ${GRPC_SERVICE_TOKEN:-oss-ci-rust-revocation-lifecycle-token-32-bytes}
  depends_on:
    migrations:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${SERVICE_PORT}/health >/dev/null"]
    interval: 2s
    timeout: 2s
    retries: 30
  networks: [marty-oss]

services:
  openbao-tls-init:
    image: ${MARTY_OPENBAO_DIDCOMM_IMAGE:?run scripts/render_stack_env.py first}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown openbao:openbao /bao/tls && chmod 0700 /bao/tls"]
    volumes:
      - openbao-tls:/bao/tls
    networks: [marty-oss]

  # Ephemeral OpenBao transit service for the OSS conformance stack. It exists
  # only on the private Compose network and supplies the normal remote signing
  # boundary; it is never exposed as a public endpoint.
  openbao:
    image: ${MARTY_OPENBAO_DIDCOMM_IMAGE:?run scripts/render_stack_env.py first}
    hostname: openbao
    cap_add: [IPC_LOCK]
    command: server -dev-tls -dev-tls-cert-dir=/bao/tls -dev-listen-address=0.0.0.0:8200 -config=/bao/config/openbao-fixture.hcl
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${BAO_DEV_ROOT_TOKEN:-oss-ci-openbao-token}
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    volumes:
      - openbao-tls:/bao/tls
      - ./services/openbao-fixture.hcl:/bao/config/openbao-fixture.hcl:ro
    depends_on:
      openbao-tls-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bao", "status", "-address=https://127.0.0.1:8200", "-ca-cert=/bao/tls/vault-ca.pem"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [marty-oss]

  openbao-ca-export:
    image: ${MARTY_OPENBAO_DIDCOMM_IMAGE:?run scripts/render_stack_env.py first}
    user: "0:0"
    entrypoint: ["/bin/sh", "/scripts/export_disposable_openbao_ca.sh"]
    volumes:
      - ./scripts/export_disposable_openbao_ca.sh:/scripts/export_disposable_openbao_ca.sh:ro
      - openbao-tls:/bao/tls:ro
      - openbao-public-ca:/bao/public-ca
    depends_on:
      openbao:
        condition: service_healthy
    networks: [marty-oss]

  openbao-plugin-bootstrap:
    image: ${MARTY_OPENBAO_DIDCOMM_IMAGE:?run scripts/render_stack_env.py first}
    entrypoint: ["/bin/sh", "/scripts/bootstrap_disposable_openbao.sh"]
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /bao/public-ca/vault-ca.pem
      BAO_TOKEN: ${BAO_DEV_ROOT_TOKEN:-oss-ci-openbao-token}
    volumes:
      - ./scripts/bootstrap_disposable_openbao.sh:/scripts/bootstrap_disposable_openbao.sh:ro
      - openbao-public-ca:/bao/public-ca:ro
    depends_on:
      openbao-ca-export:
        condition: service_completed_successfully
    networks: [marty-oss]

  # Network-only stdlib probe; the signed Rust migrations image has no Python.
  network-probe:
    profiles: [probe]
    image: docker.io/library/python@sha256:236173eb74001afe2f60862de935b74fcbd00adfca247b2c27051a70a6a39a2d
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [marty-oss]

  postgres:
    image: ${POSTGRES_IMAGE:?run scripts/render_stack_env.py first}
    environment:
      POSTGRES_USER: marty
      # Ephemeral public-CI credential; never used outside this disposable stack.
      POSTGRES_PASSWORD: marty_oss_ci_2026
      POSTGRES_DB: marty_credentials
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marty -d marty_credentials"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [marty-oss]

  redis:
    image: ${REDIS_IMAGE:?run scripts/render_stack_env.py first}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [marty-oss]

  # Auth resolves discovery and JWKS before reporting ready. This deliberately
  # limited fixture supplies only that startup contract; end-to-end login is
  # exercised against a real OIDC provider in the governed boundary lanes.
  oidc-discovery-fixture:
    image: nginx@sha256:679a5fd058f6ca754a561846fe27927e408074431d63556e8fc588fc38be6901
    restart: "no"
    volumes:
      - ./services/oidc-discovery-fixture:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/realms/oss-ci/.well-known/openid-configuration"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks: [marty-oss]

  migrations:
    image: ${MARTY_MIGRATIONS_IMAGE:?run scripts/render_stack_env.py first}
    environment:
      DATABASE_URL: postgresql://marty:marty_oss_ci_2026@postgres:5432/marty_credentials
      MARTY_DB_PASSWORD: marty_oss_ci_2026
      MARTY_ORG_ADMIN_EMAIL: oss-ci@elevenid.dev
      # Seed metadata from the actual public issuer address used by this
      # deployment, never a stale fixture hostname.
      PUBLIC_API_URL: ${ISSUER_BASE_URL:-https://oss-ci.elevenid.dev}
      # Enables the migration artifact's KMS/DID bootstrap for the disposable
      # test organization; issuance still uses the normal signing boundary.
      REDIS_URL: redis://redis:6379
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /bao/public-ca/vault-ca.pem
      BAO_TOKEN: ${BAO_DEV_ROOT_TOKEN:-oss-ci-openbao-token}
      # Disposable public-stack fixture: the bootstrap requires the explicit
      # notification envelope token, even when it shares this dev OpenBao root.
      NOTIFICATION_OPENBAO_TOKEN: ${BAO_DEV_ROOT_TOKEN:-oss-ci-openbao-token}
      NOTIFICATION_OPENBAO_CA_CERT_FILE: /bao/public-ca/vault-ca.pem
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao-ca-export:
        condition: service_completed_successfully
      openbao-plugin-bootstrap:
        condition: service_completed_successfully
    volumes:
      - openbao-public-ca:/bao/public-ca:ro
    networks: [marty-oss]

  auth-service:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: auth
      SERVICE_PORT: "8001"
      KEYCLOAK_REALM: oss-ci
      OIDC_ISSUER_URL: http://oidc-discovery-fixture/realms/oss-ci
      OIDC_EXTERNAL_ISSUER_URL: http://oidc-discovery-fixture/realms/oss-ci
      UI_BASE_URL: http://ui
      COOKIE_SECURE: "false"
      ALLOW_PLAINTEXT_GRPC: "true"
      CREDENTIAL_LOGIN_POLICY_ID: oss-ci-credential-login
      CREDENTIAL_LOGIN_ORGANIZATION_ID: ${MARTY_ORG_ID:-00000000-0000-0000-0000-000000000001}
      CREDENTIAL_LOGIN_ISSUER_DID: did:web:oss-ci.elevenid.dev
      # Disposable private-network callback key shared only with Flow. Real
      # deployments inject a governed secret instead of using this CI default.
      FLOW_WEBHOOK_SECRET: ${FLOW_WEBHOOK_SECRET:-oss-ci-flow-webhook-secret-32-bytes}
      FLOW_GRPC_TARGET: flow-service:9011
      ORG_GRPC_TARGET: organization-service:9002
      ES_GRPC_TARGET: event-stream-service:9015
      AUTH_SERVICE_INTERNAL_URL: http://auth-service:8001
      APPLICANT_SERVICE_URL: http://applicant-service:8006
      ISSUANCE_SERVICE_URL: http://issuance-service:8005
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      oidc-discovery-fixture:
        condition: service_healthy
      organization-service:
        condition: service_healthy
      flow-service:
        condition: service_healthy
      event-stream-service:
        condition: service_healthy
      applicant-service:
        condition: service_healthy
      issuance-service:
        condition: service_healthy

  organization-service:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: organization
      SERVICE_PORT: "8002"

  credential-template-service:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: credential_template
      SERVICE_PORT: "8003"
      # System template identifiers and issuer DIDs must match the public
      # issuer identity seeded by the migration artifact.
      PUBLIC_API_URL: ${ISSUER_BASE_URL:-https://oss-ci.elevenid.dev}

  trust-profile-service:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: trust_profile
      SERVICE_PORT: "8004"
      MARTY_ISSUER_BASE_URL: ${ISSUER_BASE_URL:-https://oss-ci.elevenid.dev}

  issuance-service:
    image: ${MARTY_ISSUANCE_IMAGE:?run scripts/render_stack_env.py first}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8005/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      SERVICE_NAME: issuance_native
      ENVIRONMENT: test
      MARTY_SCHEMA_STARTUP_MODE: validate
      ISSUANCE_SERVICE_PORT: "8005"
      DATABASE_URL: postgresql://marty:marty_oss_ci_2026@postgres:5432/marty_credentials
      REDIS_URL: redis://redis:6379
      # The issuer URL is a public protocol identifier, never an internal
      # service address. Official lanes override this with their TLS bridge.
      ISSUER_BASE_URL: ${ISSUER_BASE_URL:-https://oss-ci.elevenid.dev}
      CREDENTIAL_TEMPLATE_SERVICE_URL: http://credential-template-service:8003
      REVOCATION_PROFILE_SERVICE_URL: http://revocation-profile-service:8013
      # Service names in this artifact stack are intentionally explicit. The
      # issuer validates organization, template, and revocation bindings over
      # their production gRPC contracts before creating an offer.
      ORG_GRPC_TARGET: organization-service:9002
      CT_GRPC_TARGET: credential-template-service:9003
      RP_GRPC_TARGET: revocation-profile-service:9013
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /bao/public-ca/vault-ca.pem
      BAO_TOKEN: ${BAO_DEV_ROOT_TOKEN:-oss-ci-openbao-token}
      TOKEN_HMAC_KEY: test-only-token-hmac-key-32-bytes
      GRPC_SERVICE_TOKEN: ${GRPC_SERVICE_TOKEN:-oss-ci-rust-revocation-lifecycle-token-32-bytes}
      SIGNING_KEYS_INTERNAL_API_KEY: ${SIGNING_KEYS_INTERNAL_API_KEY:-oss-ci-rust-signing-internal-key-32-bytes}
      SIGNING_KEYS_INTERNAL_URL: http://gateway:8000/internal/signing-keys
      DIDCOMM_DID_WEB_INTERNAL_BASE_URL: http://gateway:8000
      PUBLIC_API_URL: ${ISSUER_BASE_URL:-https://oss-ci.elevenid.dev}
      UI_BASE_URL: http://ui
      CANVAS_LTI_EXPERIENCE_BASE_URL: ${ISSUER_BASE_URL:-https://oss-ci.elevenid.dev}
      CANVAS_MIRROR_WORKER_ENABLED: "false"
      # Shared only on the private Compose network so the authenticated gateway
      # can call the issuer's management API. This disposable default is not a
      # deployment credential; production supplies its own secret.
      ISSUANCE_API_KEY: ${ISSUANCE_API_KEY:-oss-ci-issuance-internal-key-32-bytes}
    depends_on:
      migrations:
        condition: service_completed_successfully
      issuance-migrations:
        condition: service_completed_successfully
    volumes:
      - openbao-public-ca:/bao/public-ca:ro
    networks: [marty-oss]

  # The same signed Rust services image owns issuance migrations and runtime.
  issuance-migrations:
    image: ${MARTY_ISSUANCE_IMAGE:?run scripts/render_stack_env.py first}
    entrypoint: ["/usr/local/bin/marty-issuance-service"]
    command: ["migrate"]
    restart: "no"
    environment:
      SERVICE_NAME: issuance_native
      DATABASE_URL: postgresql://marty:marty_oss_ci_2026@postgres:5432/marty_credentials
    depends_on:
      migrations:
        condition: service_completed_successfully
      # Rust issuance seeds from the Credential Template catalog and reads
      # the organization table. Both native owners complete startup first.
      credential-template-service:
        condition: service_healthy
      organization-service:
        condition: service_healthy
    networks: [marty-oss]

  applicant-service:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: applicant
      SERVICE_PORT: "8006"
      FLOW_SERVICE_URL: http://flow-service:8011
      FLOW_GRPC_TARGET: flow-service:9011
      ISSUANCE_SERVICE_URL: http://issuance-service:8005
      ISSUANCE_API_KEY: ${ISSUANCE_API_KEY:-oss-ci-issuance-internal-key-32-bytes}
      ORG_GRPC_TARGET: organization-service:9002
      # Disposable artifact-test identity. Production deployments inject a
      # random secret; this value is scoped only to Applicant and Flow here.
      FLOW_APPLICATION_EVENT_HMAC_KEY: ${FLOW_APPLICATION_EVENT_HMAC_KEY:-oss-ci-application-event-hmac-key-32-bytes}

  compliance-profile-service:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: compliance_profile
      SERVICE_PORT: "8008"

  presentation-policy-service:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: presentation_policy
      SERVICE_PORT: "8009"

  deployment-profile-service:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: deployment_profile
      SERVICE_PORT: "8010"

  event-stream-service:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: event_stream
      SERVICE_PORT: "8015"
      EVENT_STREAM_SERVICE_PORT: "8015"
      EVENT_STREAM_GRPC_ENABLED: "true"
      EVENT_STREAM_GRPC_PORT: "9015"

  flow-service:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: flow
      SERVICE_PORT: "8011"
      FLOW_GRPC_PORT: "9011"
      PUBLIC_BASE_URL: ${ISSUER_BASE_URL:-https://oss-ci.elevenid.dev}
      GRPC_INSECURE_ALLOWED: "true"
      ISSUANCE_SERVICE_URL: http://issuance-service:8005
      ISSUANCE_API_KEY: ${ISSUANCE_API_KEY:-oss-ci-issuance-internal-key-32-bytes}
      ISSUANCE_GRPC_TARGET: issuance-service:9005
      CT_GRPC_TARGET: credential-template-service:9003
      PP_GRPC_TARGET: presentation-policy-service:9009
      ORG_GRPC_TARGET: organization-service:9002
      CREDENTIAL_TEMPLATE_SERVICE_URL: http://credential-template-service:8003
      TRUST_PROFILE_SERVICE_URL: http://trust-profile-service:8004
      DEPLOYMENT_PROFILE_SERVICE_URL: http://deployment-profile-service:8010
      FLOW_APPLICATION_EVENT_HMAC_KEY: ${FLOW_APPLICATION_EVENT_HMAC_KEY:-oss-ci-application-event-hmac-key-32-bytes}
      FLOW_WEBHOOK_SECRET: ${FLOW_WEBHOOK_SECRET:-oss-ci-flow-webhook-secret-32-bytes}
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      organization-service:
        condition: service_healthy
      credential-template-service:
        condition: service_healthy
      presentation-policy-service:
        condition: service_healthy
      issuance-service:
        condition: service_healthy
      signing-keys:
        condition: service_healthy
      trust-profile-service:
        condition: service_healthy
      deployment-profile-service:
        condition: service_healthy

  revocation-profile-service:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: revocation_profile
      SERVICE_PORT: "8013"

  gateway:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: gateway
      SERVICE_PORT: "8000"
      AUTH_SERVICE_URL: http://auth-service:8001
      ORGANIZATION_SERVICE_URL: http://organization-service:8002
      CREDENTIAL_TEMPLATE_SERVICE_URL: http://credential-template-service:8003
      TRUST_PROFILE_SERVICE_URL: http://trust-profile-service:8004
      ISSUANCE_SERVICE_URL: http://issuance-service:8005
      APPLICANT_SERVICE_URL: http://applicant-service:8006
      # OAuth Authorization Server metadata and Credential Issuer metadata
      # must advertise the same externally reachable HTTPS identifier.
      ISSUER_BASE_URL: ${ISSUER_BASE_URL:-https://oss-ci.elevenid.dev}
      # Must match the issuer's internal management key above. It is injected
      # only after the gateway's normal authentication/authorization checks.
      ISSUANCE_API_KEY: ${ISSUANCE_API_KEY:-oss-ci-issuance-internal-key-32-bytes}
      COMPLIANCE_PROFILE_SERVICE_URL: http://compliance-profile-service:8008
      PRESENTATION_POLICY_SERVICE_URL: http://presentation-policy-service:8009
      DEPLOYMENT_PROFILE_SERVICE_URL: http://deployment-profile-service:8010
      FLOW_SERVICE_URL: http://flow-service:8011
      REVOCATION_PROFILE_SERVICE_URL: http://revocation-profile-service:8013
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /bao/public-ca/vault-ca.pem
      BAO_TOKEN: ${BAO_DEV_ROOT_TOKEN:-oss-ci-openbao-token}
    ports: ["28000:8000"]

  ui:
    image: ${MARTY_UI_IMAGE:?run scripts/render_stack_env.py first}
    ports: ["23000:80"]
    depends_on: [gateway]
    networks: [marty-oss]

  # Opt-in TLS boundary used by the official OIDF conformance suite. Production
  # deployments terminate TLS outside this Compose file; this profile makes the
  # local certification path exercise the same HTTPS metadata and endpoints.
  tls-proxy:
    profiles: [oidf]
    image: nginx@sha256:679a5fd058f6ca754a561846fe27927e408074431d63556e8fc588fc38be6901
    ports: ["28443:443"]
    volumes:
      - ./services/tls-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./conformance/local-certs}:/etc/nginx/certs:ro
    depends_on: [gateway]
    networks: [marty-oss]

  # Thin, disposable HTTP facade around the official EUDI Wallet Kit JVM
  # libraries. It exists only in the EUDI conformance profile; the tests use
  # it to drive Marty through the same library family as the reference wallet.
  eudi-wallet-harness:
    profiles: [eudi]
    build:
      context: ./services/eudi-wallet-harness
    ports: ["${EUDI_WALLET_KIT_HOST_PORT:-29090}:9090"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9090/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [marty-oss]
    restart: "no"

networks:
  marty-oss:
    driver: bridge

volumes:
  openbao-tls:
  openbao-public-ca:
